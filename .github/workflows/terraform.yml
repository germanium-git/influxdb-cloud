# Plan on pull requests (plan posted as a PR comment), apply on merge to main.
# Runs execute in Terraform Cloud (mygermanium/influxdb-cloud); the InfluxDB
# token lives there as the sensitive environment variable INFLUXDB_TOKEN.
# Required GitHub secret: TF_API_TOKEN (Terraform Cloud API token).
name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Never run two Terraform operations on the workspace at once
concurrency:
  group: terraform-influxdb-cloud
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color > plan.txt 2>&1
          rc=$?
          set -e
          cat plan.txt
          exit $rc

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : 'no output';
            // Keep the useful part: from the resource changes to the end
            const start = plan.search(/Terraform will perform|No changes\.|Error:/);
            if (start > 0) plan = plan.slice(start);
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated, see the workflow log)';
            const icon = process.env.OUTCOME === 'success' ? '✅' : '❌';
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### ${icon} Terraform plan\n\n\`\`\`\n${plan}\n\`\`\`\n\nMerging to \`main\` applies this plan.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -no-color
